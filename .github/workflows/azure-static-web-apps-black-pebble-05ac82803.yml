name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  unit_tests:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      issues: write
    outputs:
      static_web_app_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Track TODOs as issues
        if: github.ref_name == 'prod' || github.ref_name == 'dev'
        uses: ribtoks/tdg-github-action@master
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ASSIGN_FROM_BLAME: true
          COMMENT_ON_ISSUES: true
          EXCLUDE_PATTERN: '(node_modules|dist|build|\.svelte-kit)/'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: "!(github.event_name == 'push' && (github.ref_name == 'prod' || github.ref_name == 'dev'))"
        run: npm run lint:ci
      - name: Lint and file issues for remaining errors
        if: github.event_name == 'push' && (github.ref_name == 'prod' || github.ref_name == 'dev')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/lint-and-file-issues.mjs
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          API_URL: ${{ secrets.API_URL }}
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_WIDGET_ACCESS_TOKEN: ${{ secrets.WIDGET_ACCESS_TOKEN }}
          SITE_TITLE: ${{ secrets.SITE_TITLE }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_PEBBLE_05AC82803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "build"

  accessibility_tests:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Accessibility Tests (PR preview)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Wait for PR preview to be live
        env:
          PREVIEW_URL: ${{ needs.build_and_deploy_job.outputs.static_web_app_url }}
        run: |
          echo "Waiting for $PREVIEW_URL"
          for i in $(seq 1 30); do
            if command curl -sfo /dev/null "$PREVIEW_URL"; then
              echo "Preview is live"
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not come up in time" >&2
          exit 1
      - name: Sign in and run Playwright checks (accessibility + e2e flows)
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build_and_deploy_job.outputs.static_web_app_url }}
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_TEST_USER_EMAIL: ${{ secrets.CLERK_TEST_USER_EMAIL }}
          CLERK_TEST_USER_PASSWORD: ${{ secrets.CLERK_TEST_USER_PASSWORD }}
        run: npm run test:e2e
      - name: Run pa11y accessibility checks
        if: always()
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build_and_deploy_job.outputs.static_web_app_url }}
        run: npm run test:a11y:pa11y
      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            playwright-report/
            pa11y-report/
          retention-days: 14

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_PEBBLE_05AC82803 }}
          action: "close"
